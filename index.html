<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Polynomial Grapher</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div style="max-width: 600px; margin: 20px auto;">
        <h2>Polynomial Graph Plotter</h2>
        <input type="text" id="polyInput" placeholder="e.g. (x+1)^2 or 3x^2 - 5x + 1" style="width: 70%; padding: 8px;">
        <button onclick="handlePlot()" style="padding: 8px 16px;">Plot Graph</button>
        <div style="margin-top: 20px;">
            <canvas id="polyChart"></canvas>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
